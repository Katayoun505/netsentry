<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NetSentry</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap');

  :root {
    --bg: #0b0e14;
    --panel: #131820;
    --panel-border: #1f2733;
    --text: #c9d1d9;
    --text-dim: #6e7681;
    --accent: #39d353;
    --critical: #f85149;
    --high: #f85149;
    --medium: #d29922;
    --low: #3fb950;
    --anomaly: #a371f7;
    --sim-badge-bg: #3a2a0d;
    --sim-badge-text: #d29922;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }

  .mono { font-family: 'JetBrains Mono', monospace; }

  /* ---------- Login screen ---------- */
  #login-screen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
  }

  .brand {
    font-family: 'JetBrains Mono', monospace;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .pulse-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(57, 211, 83, 0.7);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(57, 211, 83, 0.5); }
    70% { box-shadow: 0 0 0 10px rgba(57, 211, 83, 0); }
    100% { box-shadow: 0 0 0 0 rgba(57, 211, 83, 0); }
  }

  .login-box {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 32px;
    width: 320px;
  }

  .field { margin-bottom: 16px; }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .field input {
    width: 100%;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--panel-border);
    border-radius: 4px;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px;
  }

  .field input:focus {
    outline: none;
    border-color: var(--accent);
  }

  button {
    width: 100%;
    padding: 10px;
    background: var(--accent);
    color: #0b0e14;
    border: none;
    border-radius: 4px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
  }

  button:hover { opacity: 0.9; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #login-error {
    color: var(--critical);
    font-size: 13px;
    margin-top: 10px;
    display: none;
  }

  /* ---------- Dashboard ---------- */
  #dashboard { display: none; }

  header {
    border-bottom: 1px solid var(--panel-border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header .brand { font-size: 18px; }

  .user-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .role-tag {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--accent);
  }

  #logout-btn {
    width: auto;
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--text-dim);
    padding: 6px 12px;
    font-size: 12px;
  }

  main {
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    overflow: hidden;
  }

  .panel-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--panel-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .panel-header h2 {
    font-size: 14px;
    margin: 0;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .count-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--accent);
  }

  .feed {
    max-height: 480px;
    overflow-y: auto;
  }

  .feed-row {
    padding: 10px 18px;
    border-bottom: 1px solid var(--panel-border);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .feed-row:last-child { border-bottom: none; }

  .sev-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .sev-critical, .sev-high { background: var(--high); }
  .sev-medium { background: var(--medium); }
  .sev-low { background: var(--low); }
  .sev-dot.rule-anomalous { background: var(--anomaly); }

  .feed-row .rule {
    font-weight: 700;
    color: var(--text);
    min-width: 130px;
  }

  .feed-row .desc { color: var(--text-dim); flex: 1; }
  .feed-row .geo { color: var(--text-dim); font-size: 11px; white-space: nowrap; }
  .feed-row .time { color: var(--text-dim); font-size: 11px; white-space: nowrap; }

  .sim-badge {
    background: var(--sim-badge-bg);
    color: var(--sim-badge-text);
    font-size: 9.5px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.5px;
    white-space: nowrap;
  }

  .empty-state {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  .restricted {
    padding: 40px 20px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  /* ---------- Map panel ---------- */
  .map-panel-wrapper {
    padding: 0 24px;
  }

  #attacker-map {
    height: 320px;
    width: 100%;
    background: var(--bg);
  }

  .leaflet-popup-content-wrapper {
    background: var(--panel);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    border: 1px solid var(--panel-border);
  }

  .leaflet-popup-tip { background: var(--panel); }

  .popup-sim-note {
    color: var(--sim-badge-text);
    font-weight: 700;
    font-size: 10px;
    margin-top: 4px;
  }
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="login-screen">
  <div class="brand"><span class="pulse-dot"></span> NETSENTRY_</div>
  <div class="login-box">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" autocomplete="current-password">
    </div>
    <button onclick="login()">Sign in</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- ============ DASHBOARD ============ -->
<div id="dashboard">
  <header>
    <div class="brand"><span class="pulse-dot"></span> NETSENTRY_</div>
    <div class="user-badge">
      <span id="user-display"></span>
      <span class="role-tag" id="role-display"></span>
      <button id="logout-btn" onclick="logout()">Sign out</button>
    </div>
  </header>

  <div class="map-panel-wrapper" style="padding-top: 24px;">
    <div class="panel">
      <div class="panel-header">
        <h2>Attacker map</h2>
        <span class="count-badge" id="map-count">0 locations</span>
      </div>
      <div id="attacker-map"></div>
    </div>
  </div>

  <main>
    <div class="panel">
      <div class="panel-header">
        <h2>Alerts</h2>
        <span class="count-badge" id="alerts-count">0</span>
      </div>
      <div class="feed" id="alerts-feed">
        <div class="empty-state">No alerts yet. Waiting for detection engine...</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">
        <h2>Traffic logs</h2>
        <span class="count-badge" id="logs-count">0</span>
      </div>
      <div class="feed" id="logs-feed">
        <div class="empty-state">No traffic captured yet...</div>
      </div>
    </div>
  </main>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const API_BASE = "http://127.0.0.1:8000";
  let token = null;
  let role = null;
  let pollTimer = null;

  // ---------- Map setup ----------
  let map = null;
  let markerLayer = null;

  function initMap() {
    if (map) return; // already initialized
    map = L.map('attacker-map', {
      worldCopyJump: true,
    }).setView([20, 0], 2);

    // CartoDB dark tiles — free, no API key, matches the dashboard theme
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
      maxZoom: 18,
    }).addTo(map);

    markerLayer = L.layerGroup().addTo(map);
  }

  function updateMap(alerts) {
    if (!map) return;
    markerLayer.clearLayers();

    // De-duplicate by source_ip so repeated alerts from the same
    // attacker don't stack multiple identical pins on the map.
    const seen = new Map();
    for (const a of alerts) {
      if (a.geo_lat == null || a.geo_lon == null) continue;
      if (!seen.has(a.source_ip)) {
        seen.set(a.source_ip, a);
      }
    }

    let count = 0;
    seen.forEach((a) => {
      count++;
      const color = a.geo_simulated ? '#d29922' : '#f85149';
      const marker = L.circleMarker([a.geo_lat, a.geo_lon], {
        radius: 7,
        color: color,
        fillColor: color,
        fillOpacity: 0.6,
        weight: 2,
      });

      const simNote = a.geo_simulated
        ? `<div class="popup-sim-note">⚠ SIMULATED — private/test IP</div>`
        : '';

      marker.bindPopup(`
        <strong>${a.rule_type}</strong><br>
        ${a.source_ip}<br>
        ${a.geo_city || 'Unknown'}, ${a.geo_country || 'Unknown'}
        ${simNote}
      `);

      marker.addTo(markerLayer);
    });

    document.getElementById("map-count").textContent = `${count} location${count === 1 ? '' : 's'}`;
  }

  async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const errorEl = document.getElementById("login-error");
    errorEl.style.display = "none";

    if (!username || !password) {
      errorEl.textContent = "Enter a username and password.";
      errorEl.style.display = "block";
      return;
    }

    try {
      const body = new URLSearchParams();
      body.append("username", username);
      body.append("password", password);

      const res = await fetch(`${API_BASE}/auth/login`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body,
      });

      if (!res.ok) {
        errorEl.textContent = "Incorrect username or password.";
        errorEl.style.display = "block";
        return;
      }

      const data = await res.json();
      token = data.access_token;
      role = data.role;

      document.getElementById("user-display").textContent = username;
      document.getElementById("role-display").textContent = role;

      document.getElementById("login-screen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";

      initMap();
      // Leaflet needs a resize nudge when its container was display:none
      // at the time the map was created, or tiles render blank/broken.
      setTimeout(() => { if (map) map.invalidateSize(); }, 100);

      fetchData();
      pollTimer = setInterval(fetchData, 5000);
    } catch (e) {
      errorEl.textContent = "Could not reach NetSentry API. Is the server running?";
      errorEl.style.display = "block";
    }
  }

  function logout() {
    token = null;
    role = null;
    clearInterval(pollTimer);
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("login-screen").style.display = "flex";
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
  }

  function timeAgo(isoString) {
    const seconds = Math.floor((new Date() - new Date(isoString + "Z")) / 1000);
    if (seconds < 60) return `${seconds}s ago`;
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    return `${Math.floor(minutes / 60)}h ago`;
  }

  async function fetchData() {
    await fetchAlerts();
    await fetchLogs();
  }

  async function fetchAlerts() {
    const res = await fetch(`${API_BASE}/alerts?limit=50`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const feed = document.getElementById("alerts-feed");

    if (!res.ok) {
      feed.innerHTML = `<div class="restricted">Access restricted for role: ${role}</div>`;
      return;
    }

    const alerts = await res.json();
    document.getElementById("alerts-count").textContent = alerts.length;

    updateMap(alerts);

    if (alerts.length === 0) {
      feed.innerHTML = `<div class="empty-state">No alerts yet. Waiting for detection engine...</div>`;
      return;
    }

    feed.innerHTML = alerts.map(a => {
      const geoText = (a.geo_city || a.geo_country)
        ? `${a.geo_city || '?'}, ${a.geo_country || '?'}`
        : '';
      const simBadge = a.geo_simulated ? `<span class="sim-badge">SIMULATED</span>` : '';
      const dotClass = a.rule_type === "ANOMALOUS_TRAFFIC"
        ? 'sev-dot rule-anomalous'
        : `sev-dot sev-${a.severity}`;
      const ruleLabel = a.rule_type === "ANOMALOUS_TRAFFIC"
        ? `∿ ${a.rule_type}`
        : a.rule_type;
      return `
        <div class="feed-row">
          <span class="${dotClass}"></span>
          <span class="rule">${ruleLabel}</span>
          <span class="desc">${a.source_ip} — ${a.description || ""}</span>
          <span class="geo">${geoText}</span>
          ${simBadge}
          <span class="time">${timeAgo(a.created_at)}</span>
        </div>
      `;
    }).join("");
  }

  async function fetchLogs() {
    const res = await fetch(`${API_BASE}/logs?limit=50`, {
      headers: { Authorization: `Bearer ${token}` },
    });
    const feed = document.getElementById("logs-feed");

    if (!res.ok) {
      feed.innerHTML = `<div class="restricted">Access restricted for role: ${role}</div>`;
      return;
    }

    const logs = await res.json();
    document.getElementById("logs-count").textContent = logs.length;

    if (logs.length === 0) {
      feed.innerHTML = `<div class="empty-state">No traffic captured yet...</div>`;
      return;
    }

    feed.innerHTML = logs.map(l => `
      <div class="feed-row">
        <span class="rule">${l.protocol}</span>
        <span class="desc">${l.source_ip}:${l.source_port ?? "-"} → ${l.destination_ip}:${l.destination_port ?? "-"}</span>
        <span class="time">${timeAgo(l.captured_at)}</span>
      </div>
    `).join("");
  }

  document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") login();
  });
</script>

</body>
</html>
